name: Buttondown source and refusal contracts

# Event-driven source qualification only. Never reads newsletter keys,
# creates remote drafts, schedules mail, or infers reader acceptance.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact public dependency closure
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify original source and all refusal/positive cases
        run: npm run verify
